<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculadora web básica">
  <title>Codigo</title>
  <link rel="stylesheet" href="FrontEnd/styles.css">
  <script src="FrontEnd/script.js" defer></script>
</head>
<body>
  <main class="calculator-shell">
    <h2>Equipo 2 | Ingenieria de Software</h2>
    <section class="calculator" aria-label="Calculadora básica">
      <h1>Calculadora</h1>
      <div id="history" class="history" aria-live="polite"></div>
      <output id="display" class="display" aria-live="polite">0</output>

      <div class="keypad" role="group" aria-label="Teclado de calculadora">
        <button class="key key-function" data-action="clear" type="button">AC</button>
        <button class="key key-function" data-action="delete" type="button" aria-label="Borrar último dígito">DEL</button>
        <span></span>
        <button class="key key-operator" data-operator="/" type="button" aria-label="Dividir">÷</button>

        <button class="key" data-number="7" type="button">7</button>
        <button class="key" data-number="8" type="button">8</button>
        <button class="key" data-number="9" type="button">9</button>
        <button class="key key-operator" data-operator="*" type="button" aria-label="Multiplicar">×</button>

        <button class="key" data-number="4" type="button">4</button>
        <button class="key" data-number="5" type="button">5</button>
        <button class="key" data-number="6" type="button">6</button>
        <button class="key key-operator" data-operator="-" type="button" aria-label="Restar">−</button>

        <button class="key" data-number="1" type="button">1</button>
        <button class="key" data-number="2" type="button">2</button>
        <button class="key" data-number="3" type="button">3</button>
        <button class="key key-operator" data-operator="+" type="button" aria-label="Sumar">+</button>

        <button class="key key-zero" data-number="0" type="button">0</button>
        <button class="key" data-number="." type="button" aria-label="Punto decimal">.</button>
        <button class="key key-equals" data-action="equals" type="button" aria-label="Resultado">=</button>
      </div>

    </section>
  </main>
</body>
</html>
